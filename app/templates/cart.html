{% extends 'base.html' %}{% block content %}<h1>Shopping Cart</h1>{% for p,q,s in products %}<div class="card mb-3"><div class="card-body">{{ p.name }} × {{ q }} — ₹{{ '%.2f'|format(s) }} <form class="d-inline" method="post" action="{{ url_for('main.remove_from_cart', product_id=p.id) }}"><button class="btn btn-sm btn-outline-danger">Remove</button></form></div></div>{% else %}<p>Your cart is empty.</p>{% endfor %}<h3>Total: ₹{{ '%.2f'|format(total) }}</h3>{% if products %}<form method="post" action="{{ url_for('main.checkout') }}"><button class="btn btn-success">Checkout</button></form>{% endif %}{% endblock %}
