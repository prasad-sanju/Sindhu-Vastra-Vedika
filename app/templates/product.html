{% extends 'base.html' %}{% block content %}<div class="row"><div class="col-md-6">{% if product.image_url %}<img src="{{ product.image_url }}" class="img-fluid rounded product-large">{% endif %}</div><div class="col-md-6"><h1>{{ product.name }}</h1><p>{{ product.description }}</p><h3>₹{{ '%.2f'|format(product.price) }}</h3><p>Stock: {{ product.stock }}</p>{% if product.stock > 0 %}<form method="post" action="{{ url_for('main.add_to_cart', product_id=product.id) }}"><button class="btn btn-dark">Add to cart</button></form>{% endif %}</div></div>{% endblock %}
