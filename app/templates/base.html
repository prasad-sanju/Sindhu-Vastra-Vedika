<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sindhu Vastra Vedika</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="{{ url_for('main.home') }}">Sindhu Vastra Vedika</a><div><a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('main.cart') }}">Cart</a>{% if session.get('user_id') %}<a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('main.orders') }}">Orders</a><a class="btn btn-light btn-sm" href="{{ url_for('auth.logout') }}">Logout</a>{% else %}<a class="btn btn-light btn-sm" href="{{ url_for('auth.login') }}">Login</a>{% endif %}</div></div></nav><main class="container py-4">{% for message in get_flashed_messages() %}<div class="alert alert-info">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
